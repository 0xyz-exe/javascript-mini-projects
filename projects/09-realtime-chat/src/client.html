<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Client</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { margin-bottom: 20px; }
    #status { padding: 10px; background: #333; border-radius: 4px; margin-bottom: 20px; }
    #status.connected { background: #2d5; color: #000; }
    #messages { background: #2a2a2a; height: 400px; overflow-y: auto; padding: 15px; border-radius: 4px; margin-bottom: 15px; }
    .message { margin-bottom: 10px; padding: 8px; background: #333; border-radius: 4px; }
    .message .username { font-weight: bold; color: #4af; }
    .message .timestamp { font-size: 0.8em; color: #888; margin-left: 10px; }
    .system { color: #fa4; font-style: italic; }
    .input-area { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; background: #333; border: none; border-radius: 4px; color: #fff; font-size: 14px; }
    button { padding: 12px 24px; background: #4af; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💬 Chat Room</h1>
    <div id="status">Disconnected</div>
    <div id="messages"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message..." disabled />
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <script>
    let ws = null;
    let username = null;

    const status = document.getElementById('status');
    const messages = document.getElementById('messages');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function connect() {
      ws = new WebSocket('ws://127.0.0.1:8080');

      ws.onopen = () => {
        status.textContent = 'Connected';
        status.className = 'connected';
        
        if (!username) {
          username = prompt('Enter username:');
          if (username) {
            ws.send(JSON.stringify({ type: 'join', username }));
            input.disabled = false;
            sendBtn.disabled = false;
          }
        }
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'welcome') {
          data.history.forEach(msg => addMessage(msg));
        } else if (data.type === 'message') {
          addMessage(data);
        } else if (data.type === 'user-joined' || data.type === 'user-left') {
          addSystemMessage(`${data.username} ${data.type === 'user-joined' ? 'joined' : 'left'}`);
        } else if (data.type === 'error') {
          addSystemMessage(`Error: ${data.message}`);
        }
      };

      ws.onclose = () => {
        status.textContent = 'Disconnected';
        status.className = '';
        input.disabled = true;
        sendBtn.disabled = true;
        addSystemMessage('Disconnected from server');
      };

      ws.onerror = (err) => {
        addSystemMessage('Connection error');
      };
    }

    function sendMessage() {
      const content = input.value.trim();
      if (!content || !ws || ws.readyState !== 1) return;

      ws.send(JSON.stringify({ type: 'message', content }));
      input.value = '';
    }

    function addMessage(msg) {
      const div = document.createElement('div');
      div.className = 'message';
      
      const time = new Date(msg.timestamp).toLocaleTimeString();
      div.innerHTML = `<span class="username">${escapeHtml(msg.username)}:</span> ${escapeHtml(msg.content)} <span class="timestamp">${time}</span>`;
      
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'message system';
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    sendBtn.onclick = sendMessage;
    input.onkeypress = (e) => {
      if (e.key === 'Enter') sendMessage();
    };

    connect();
  </script>
</body>
</html>
