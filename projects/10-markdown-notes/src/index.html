<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Notes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
    .container { display: grid; grid-template-columns: 250px 1fr 1fr; height: 100vh; }
    .sidebar { background: #2c3e50; color: white; padding: 20px; overflow-y: auto; }
    .sidebar h2 { margin-bottom: 15px; font-size: 1.2em; }
    .btn { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 15px; }
    .btn:hover { background: #2980b9; }
    input[type="text"] { width: 100%; padding: 8px; border: 1px solid #34495e; border-radius: 4px; background: #34495e; color: white; margin-bottom: 15px; }
    .note-item { padding: 10px; margin-bottom: 8px; background: #34495e; border-radius: 4px; cursor: pointer; }
    .note-item:hover, .note-item.active { background: #3498db; }
    .note-title { font-weight: 600; margin-bottom: 4px; }
    .note-date { font-size: 0.8em; opacity: 0.7; }
    .editor-pane, .preview-pane { padding: 20px; overflow-y: auto; }
    .editor-pane { background: #fff; border-right: 1px solid #ddd; }
    .preview-pane { background: #fafafa; }
    textarea { width: 100%; height: calc(100% - 100px); border: 1px solid #ddd; border-radius: 4px; padding: 15px; font-family: 'Courier New', monospace; font-size: 14px; resize: none; }
    .note-meta { margin-bottom: 15px; }
    .note-meta input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 100%; margin-bottom: 10px; }
    .empty { text-align: center; padding: 40px; color: #999; }
    .preview-pane h1 { font-size: 2em; margin: 20px 0 10px; }
    .preview-pane h2 { font-size: 1.5em; margin: 15px 0 8px; }
    .preview-pane h3 { font-size: 1.2em; margin: 12px 0 6px; }
    .preview-pane p { margin: 10px 0; line-height: 1.6; }
    .preview-pane ul, .preview-pane ol { margin: 10px 0; padding-left: 30px; }
    .preview-pane code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; }
    .preview-pane pre { background: #f0f0f0; padding: 15px; border-radius: 4px; overflow-x: auto; }
    .preview-pane blockquote { border-left: 4px solid #ddd; padding-left: 15px; margin: 10px 0; color: #666; }
    .preview-pane a { color: #3498db; }
    .actions { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn-small { padding: 6px 12px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn-small:hover { background: #c0392b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>📝 Notes</h2>
      <button id="newNoteBtn" class="btn">+ New Note</button>
      <input type="text" id="searchInput" placeholder="Search notes..." />
      <div id="notesList"></div>
    </div>
    
    <div class="editor-pane">
      <div id="editorContent"></div>
    </div>
    
    <div class="preview-pane">
      <div id="previewContent"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
